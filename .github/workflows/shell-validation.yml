name: Shell Script Validation

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artemis-shell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Bash syntax
        run: bash -n scripts/start-emulator.sh scripts/verify-wsl2.sh
      - name: Validate patch whitespace
        run: git diff --check
